<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./images/kairo-logo.svg">
  <meta name="theme-color" content="#7c6fff">
  <title>Entrar · Kairo</title>
  <style>
    :root{
      --roxo:#7c6fff; --laranja:#ff8b5a; --bg:#0b0b1a; --bg2:#12122a;
      --card:rgba(255,255,255,0.045); --borda:rgba(255,255,255,0.1);
      --txt:#f4f4fa; --pale:#a9a9c8; --verde:#4cc991; --erro:#ff5f5f;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden;position:relative}
    .glow{position:fixed;border-radius:50%;filter:blur(130px);opacity:.3;pointer-events:none}
    .g1{width:480px;height:480px;background:var(--roxo);top:-120px;left:-100px}
    .g2{width:420px;height:420px;background:var(--laranja);bottom:-120px;right:-100px;opacity:.22}
    .card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--borda);border-radius:24px;padding:2.5rem 2rem;box-shadow:0 30px 70px rgba(0,0,0,.5)}
    .brand{display:flex;align-items:center;justify-content:center;gap:.6rem;font-weight:700;font-size:1.5rem;margin-bottom:.4rem}
    .brand svg{width:34px;height:34px}
    .sub{text-align:center;color:var(--pale);font-size:.9rem;margin-bottom:1.75rem}
    .tabs{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;margin-bottom:1.5rem}
    .tab{flex:1;text-align:center;padding:.6rem;border-radius:9px;font-size:.85rem;font-weight:600;color:var(--pale);cursor:pointer;transition:all .2s;border:none;background:transparent;font-family:var(--font)}
    .tab.active{background:linear-gradient(120deg,var(--roxo),var(--laranja));color:#fff}
    .field{margin-bottom:1rem}
    .field label{display:block;font-size:.78rem;color:var(--pale);margin-bottom:.4rem;font-weight:500}
    .field input{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.05);border:1px solid var(--borda);border-radius:12px;color:var(--txt);font-family:var(--font);font-size:.92rem;outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--roxo)}
    .btn{width:100%;padding:.85rem;border:none;border-radius:12px;background:linear-gradient(120deg,var(--roxo),var(--laranja));color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--font);transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(124,111,255,.35)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,111,255,.5)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .msg{font-size:.82rem;text-align:center;margin-top:1rem;min-height:1.1rem}
    .msg.erro{color:var(--erro)}
    .msg.ok{color:var(--verde)}
    .hidden{display:none}
    .foot{text-align:center;margin-top:1.5rem;font-size:.78rem;color:var(--pale)}
    .foot a{color:var(--roxo);text-decoration:none}
    .hint{background:rgba(124,111,255,.08);border:1px solid rgba(124,111,255,.2);border-radius:10px;padding:.6rem .8rem;font-size:.74rem;color:var(--pale);margin-bottom:1.25rem;text-align:center}
  </style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="lg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#7c6fff"/><stop offset="1" stop-color="#ff8b5a"/></linearGradient></defs>
        <path d="M44 12.5 A24 24 0 1 0 53.5 30" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="32" r="7.5" fill="url(#lg)"/>
      </svg>
      Kairo
    </div>
    <p class="sub">Domine o seu tempo</p>

    <div class="tabs">
      <button class="tab active" id="tab-login">Entrar</button>
      <button class="tab" id="tab-register">Criar conta</button>
    </div>

    <!-- Formulário de Login -->
    <form id="form-login">
      <div class="hint">Administrador demo: <strong>admin@admin.com</strong> / <strong>admin123</strong></div>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="btn-login">Entrar</button>
    </form>

    <!-- Formulário de Registro -->
    <form id="form-register" class="hidden">
      <div class="field">
        <label for="reg-name">Nome</label>
        <input type="text" id="reg-name" placeholder="Seu nome" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="reg-email">E-mail</label>
        <input type="email" id="reg-email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password">Senha (mín. 6 caracteres)</label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn" id="btn-register">Criar conta grátis</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="foot">Ao continuar, você entra no plano <strong>Free</strong>. <a href="/landing.html">Conheça os planos</a></div>
  </div>

  <script>
    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const formLogin = document.getElementById("form-login");
    const formReg = document.getElementById("form-register");
    const msg = document.getElementById("msg");

    function setMsg(text, type) { msg.textContent = text; msg.className = "msg " + (type || ""); }

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active"); tabReg.classList.remove("active");
      formLogin.classList.remove("hidden"); formReg.classList.add("hidden"); setMsg("");
    });
    tabReg.addEventListener("click", () => {
      tabReg.classList.add("active"); tabLogin.classList.remove("active");
      formReg.classList.remove("hidden"); formLogin.classList.add("hidden"); setMsg("");
    });

    // Se já estiver autenticado, vai direto para o app
    (async () => {
      try { const r = await fetch("/api/auth/me"); if (r.ok) window.location.href = "/"; } catch(_){}
    })();

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login"); btn.disabled = true; setMsg("Entrando…");
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("login-email").value, password: document.getElementById("login-password").value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Falha ao entrar.");
        setMsg("Bem-vindo!", "ok");
        window.location.href = "/";
      } catch (err) { setMsg(err.message, "erro"); btn.disabled = false; }
    });

    formReg.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-register"); btn.disabled = true; setMsg("Criando conta…");
      try {
        const res = await fetch("/api/auth/register", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: document.getElementById("reg-name").value, email: document.getElementById("reg-email").value, password: document.getElementById("reg-password").value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Falha ao criar conta.");
        setMsg("Conta criada! Entrando…", "ok");
        window.location.href = "/";
      } catch (err) { setMsg(err.message, "erro"); btn.disabled = false; }
    });
  </script>
</body>
</html>
