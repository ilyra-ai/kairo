<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'">
  <link rel="icon" type="image/svg+xml" href="/assets/images/kairo-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Imprima&display=swap">
  <meta name="theme-color" content="#7c6fff">
  <title>Entrar · Kairo</title>
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="lg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#7c6fff"/><stop offset="1" stop-color="#ff8b5a"/></linearGradient></defs>
        <path d="M44 12.5 A24 24 0 1 0 53.5 30" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="32" r="7.5" fill="url(#lg)"/>
      </svg>
      Kairo
    </div>
    <p class="sub">Domine o seu tempo</p>

    <div class="tabs">
      <button class="tab active" id="tab-login">Entrar</button>
      <button class="tab" id="tab-register">Criar conta</button>
    </div>

    <!-- Formulário de Login -->
    <form id="form-login">
      <div class="hint" id="auth-context" role="status">Verificando a configuração da conta…</div>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="btn-login">Entrar</button>
    </form>

    <!-- Formulário de Registro -->
    <form id="form-register" class="hidden">
      <div class="field">
        <label for="reg-name">Nome</label>
        <input type="text" id="reg-name" placeholder="Seu nome" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="reg-email">E-mail</label>
        <input type="email" id="reg-email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="reg-password">Senha forte (12 a 128 caracteres)</label>
        <input type="password" id="reg-password" placeholder="Use maiúscula, minúscula, número e símbolo" autocomplete="new-password" minlength="12" maxlength="128" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,128}" required>
      </div>
      <button type="submit" class="btn" id="btn-register">Criar conta grátis</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="foot">Ao continuar, você entra no plano <strong>Free</strong>. <a href="/">Conheça os planos</a></div>
  </div>

  <script src="/assets/js/auth.js" defer></script>
</body>
</html>
